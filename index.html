<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecoSys — Recommendation System</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0f14;
            --surface: #161920;
            --border: #252a35;
            --accent: #00e5a0;
            --accent2: #5b8fff;
            --text: #e2e8f0;
            --muted: #6b7280;
            --tag-bg: #1e2532;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 4rem;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 229, 160, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 160, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
        }

        header {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .badge {
            display: inline-block;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 2px;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            margin-top: 0.6rem;
            color: var(--muted);
            font-size: 0.8rem;
        }

        /* Search box */
        .search-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--accent);
        }

        .search-label {
            display: block;
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .input-row {
            display: flex;
            gap: 0.75rem;
        }

        #query {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            padding: 0.65rem 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #query:focus {
            border-color: var(--accent2);
        }

        #query::placeholder {
            color: var(--muted);
        }

        button {
            background: var(--accent);
            color: #0d0f14;
            border: none;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0 1.25rem;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            white-space: nowrap;
        }

        button:hover {
            opacity: 0.85;
        }

        button:active {
            transform: scale(0.97);
        }

        /* Chips / hints */
        .hints {
            margin-top: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .hint {
            font-size: 0.7rem;
            color: var(--muted);
            background: var(--tag-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.2rem 0.55rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }

        .hint:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Results */
        #results-section {
            display: none;
        }

        .results-header {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.75rem;
        }

        .results-header span {
            color: var(--accent);
        }

        .result-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            animation: slideIn 0.25s ease forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card:nth-child(2) {
            animation-delay: 0.05s;
        }

        .result-card:nth-child(3) {
            animation-delay: 0.10s;
        }

        .result-card:nth-child(4) {
            animation-delay: 0.15s;
        }

        .result-card:nth-child(5) {
            animation-delay: 0.20s;
        }

        .result-left {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .result-name {
            font-family: 'Syne', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .result-keyword {
            font-size: 0.7rem;
            color: var(--muted);
        }

        .result-keyword span {
            color: var(--accent2);
        }

        .result-tag {
            font-size: 0.65rem;
            color: var(--accent);
            background: rgba(0, 229, 160, 0.08);
            border: 1px solid rgba(0, 229, 160, 0.25);
            border-radius: 3px;
            padding: 0.2rem 0.55rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .no-result {
            text-align: center;
            color: var(--muted);
            padding: 2rem;
            font-size: 0.85rem;
        }

        /* Divider before catalog */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2rem 0;
        }

        /* Catalog */
        .catalog-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 0.4rem 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
            transition: color 0.15s, border-color 0.15s;
        }

        .catalog-toggle:hover {
            color: var(--text);
            border-color: var(--text);
        }

        #catalog {
            display: none;
            margin-top: 1.5rem;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.4rem;
        }

        .cat-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.5rem 0.75rem;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
        }

        .cat-kw {
            color: var(--accent2);
        }

        .cat-rec {
            color: var(--text);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <header>
            <div class="badge">Unix Course — Final Project</div>
            <h1>Reco<span>Sys</span></h1>
            <p class="subtitle">// type a keyword, get a recommendation</p>
        </header>

        <div class="search-box">
            <label class="search-label" for="query">→ input keyword</label>
            <div class="input-row">
                <input id="query" type="text" placeholder='e.g. "hot", "tired", "bored"...' autocomplete="off" />
                <button onclick="search()">Search</button>
            </div>
            <div class="hints" id="hints"></div>
        </div>

        <div id="results-section">
            <p class="results-header">Results for: <span id="query-echo"></span></p>
            <div id="results"></div>
        </div>

        <hr class="divider" />
        <button class="catalog-toggle" onclick="toggleCatalog()">[ view full catalog ]</button>
        <div id="catalog">
            <div class="catalog-grid" id="catalog-grid"></div>
        </div>
    </div>

    <script>
        const hints = ['hot', 'cold', 'hungry', 'tired', 'bored', 'happy', 'sad', 'rainy', 'spicy', 'active'];

        // Render hint chips
        const hintEl = document.getElementById('hints');
        hints.forEach(h => {
            const chip = document.createElement('span');
            chip.className = 'hint';
            chip.textContent = h;
            chip.onclick = () => { document.getElementById('query').value = h; search(); };
            hintEl.appendChild(chip);
        });

        // Enter key
        document.getElementById('query').addEventListener('keydown', e => {
            if (e.key === 'Enter') search();
        });

        async function search() {
            const q = document.getElementById('query').value.trim();
            if (!q) return;

            const section = document.getElementById('results-section');
            const container = document.getElementById('results');
            document.getElementById('query-echo').textContent = `"${q}"`;
            section.style.display = 'block';
            container.innerHTML = '<p class="no-result">Searching...</p>';

            try {
                const res = await fetch(`/api/recommend?q=${encodeURIComponent(q)}`);
                const data = await res.json();

                if (!data.results.length) {
                    container.innerHTML = '<p class="no-result">No match found. Try another keyword.</p>';
                    return;
                }

                container.innerHTML = data.results.map(r => `
          <div class="result-card">
            <div class="result-left">
              <div class="result-name">${r.recommendation}</div>
              <div class="result-keyword">matched: <span>${r.keyword}</span></div>
            </div>
            <div class="result-tag">${r.category}</div>
          </div>
        `).join('');

            } catch {
                container.innerHTML = '<p class="no-result">Error connecting to server.</p>';
            }
        }

        let catalogLoaded = false;
        let catalogOpen = false;

        async function toggleCatalog() {
            const el = document.getElementById('catalog');
            catalogOpen = !catalogOpen;
            el.style.display = catalogOpen ? 'block' : 'none';
            document.querySelector('.catalog-toggle').textContent =
                catalogOpen ? '[ hide catalog ]' : '[ view full catalog ]';

            if (catalogOpen && !catalogLoaded) {
                const res = await fetch('/api/items');
                const data = await res.json();
                const grid = document.getElementById('catalog-grid');
                grid.innerHTML = data.items.map(i => `
          <div class="cat-row">
            <span class="cat-kw">${i.keyword}</span>
            <span class="cat-rec">${i.recommendation}</span>
          </div>
        `).join('');
                catalogLoaded = true;
            }
        }
    </script>
</body>

</html>
