<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecoSys — Recommendation System</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="wrapper">
        <header>
            <div class="badge">Unix Course — Final Project</div>
            <h1>Reco<span>Sys</span></h1>
            <p class="subtitle">// type a keyword, get a recommendation</p>
        </header>

        <div class="search-box">
            <label class="search-label" for="query">→ input keyword</label>
            <div class="input-row">
                <h2>testing jenkins connection</h2>
                <input id="query" type="text" placeholder='e.g. "hot", "tired", "bored"...' autocomplete="off" />
                <button onclick="search()">Search</button>
            </div>
            <div class="hints" id="hints"></div>
        </div>

        <div id="results-section">
            <p class="results-header">Results for: <span id="query-echo"></span></p>
            <div id="results"></div>
        </div>

        <hr class="divider" />
        <button class="catalog-toggle" onclick="toggleCatalog()">[ view full catalog ]</button>
        <div id="catalog">
            <div class="catalog-grid" id="catalog-grid"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
